<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="1920" height="800">
  <defs>
    <radialGradient id="nebula1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="oklch(0.6 0.18 264 / 0.15)"/>
      <stop offset="50%" stop-color="oklch(0.45 0.2 290 / 0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="70%" cy="60%" r="45%">
      <stop offset="0%" stop-color="oklch(0.5 0.2 320 / 0.12)"/>
      <stop offset="60%" stop-color="oklch(0.5 0.15 200 / 0.06)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="nebula3" cx="50%" cy="30%" r="35%">
      <stop offset="0%" stop-color="oklch(0.6 0.18 264 / 0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowLarge">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="800" fill="oklch(0.12 0.02 270)"/>

  <!-- Nebulae -->
  <rect width="1920" height="800" fill="url(#nebula1)"/>
  <rect width="1920" height="800" fill="url(#nebula2)"/>
  <rect width="1920" height="800" fill="url(#nebula3)"/>

  <!-- Stars - small -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="340" cy="150" r="1"/>
    <circle cx="520" cy="60" r="1.5"/>
    <circle cx="680" cy="220" r="1"/>
    <circle cx="850" cy="90" r="2"/>
    <circle cx="1020" cy="180" r="1"/>
    <circle cx="1250" cy="70" r="1.5"/>
    <circle cx="1480" cy="200" r="1"/>
    <circle cx="1650" cy="110" r="2"/>
    <circle cx="1820" cy="160" r="1"/>
    <circle cx="200" cy="350" r="1"/>
    <circle cx="450" cy="420" r="1.5"/>
    <circle cx="600" cy="500" r="1"/>
    <circle cx="780" cy="380" r="1.5"/>
    <circle cx="920" cy="550" r="1"/>
    <circle cx="1100" cy="400" r="2"/>
    <circle cx="1350" cy="480" r="1"/>
    <circle cx="1550" cy="350" r="1.5"/>
    <circle cx="1750" cy="520" r="1"/>
    <circle cx="350" cy="650" r="1.5"/>
    <circle cx="550" cy="720" r="1"/>
    <circle cx="750" cy="680" r="1.5"/>
    <circle cx="950" cy="750" r="1"/>
    <circle cx="1150" cy="620" r="2"/>
    <circle cx="1400" cy="700" r="1"/>
    <circle cx="1600" cy="650" r="1.5"/>
    <circle cx="1800" cy="730" r="1"/>
    <circle cx="100" cy="550" r="1"/>
    <circle cx="300" cy="500" r="1.5"/>
    <circle cx="880" cy="250" r="1"/>
  </g>

  <!-- Dim stars -->
  <g fill="#a0b4ff" opacity="0.4">
    <circle cx="250" cy="280" r="0.8"/>
    <circle cx="480" cy="320" r="0.6"/>
    <circle cx="720" cy="140" r="0.8"/>
    <circle cx="950" cy="310" r="0.6"/>
    <circle cx="1280" cy="250" r="0.8"/>
    <circle cx="1580" cy="280" r="0.6"/>
    <circle cx="220" cy="600" r="0.8"/>
    <circle cx="680" cy="580" r="0.6"/>
    <circle cx="1080" cy="680" r="0.8"/>
    <circle cx="1480" cy="600" r="0.6"/>
    <circle cx="1720" cy="420" r="0.8"/>
    <circle cx="420" cy="180" r="0.6"/>
    <circle cx="620" cy="440" r="0.8"/>
    <circle cx="1320" cy="560" r="0.6"/>
    <circle cx="1650" cy="190" r="0.8"/>
  </g>

  <!-- Glowing stars -->
  <g filter="url(#glow)" fill="#8ab4ff" opacity="0.9">
    <circle cx="850" cy="90" r="2"/>
    <circle cx="1650" cy="110" r="2"/>
    <circle cx="1100" cy="400" r="2"/>
    <circle cx="1150" cy="620" r="2"/>
  </g>

  <!-- Bright star with large glow -->
  <g filter="url(#glowLarge)" fill="#7aaaff" opacity="0.6">
    <circle cx="1600" cy="150" r="3"/>
  </g>

  <!-- Subtle horizontal gradient overlay for text readability -->
  <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="60%" y2="0%">
    <stop offset="0%" stop-color="oklch(0.12 0.02 270 / 0.7)"/>
    <stop offset="100%" stop-color="oklch(0.12 0.02 270 / 0)"/>
  </linearGradient>
  <rect width="800" height="800" fill="url(#fadeLeft)" opacity="0.5"/>

  <linearGradient id="fadeRight" x1="100%" y1="0%" x2="40%" y2="0%">
    <stop offset="0%" stop-color="oklch(0.12 0.02 270 / 0.7)"/>
    <stop offset="100%" stop-color="oklch(0.12 0.02 270 / 0)"/>
  </linearGradient>
  <rect x="1120" width="800" height="800" fill="url(#fadeRight)" opacity="0.5"/>
</svg>